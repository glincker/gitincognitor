name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              name="git-incognitor_${os}_${arch}"
              mkdir "dist/${name}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/glincker/gitincognitor/internal/cli.version=${GITHUB_REF_NAME}" \
                -o "dist/${name}/git-incognitor" ./cmd/git-incognitor
              cp LICENSE README.md "dist/${name}/"
              tar -C "dist/${name}" -czf "dist/${name}.tar.gz" git-incognitor LICENSE README.md
              rm -r "dist/${name}"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes
